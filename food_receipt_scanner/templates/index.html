<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Receipt Scanner</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
    h1 { font-size: 1.4rem; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    input[type=file] { margin-bottom: 10px; }
    button { background: #0a66c2; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    pre { background: #f5f5f5; padding: 12px; border-radius: 6px; white-space: pre-wrap; font-size: 0.85rem; }
    #chat { display: flex; gap: 8px; }
    #chat input { flex: 1; padding: 8px; }
    .msg { margin: 8px 0; }
    .q { font-weight: 600; }
  </style>
</head>
<body>
  <h1>Food Receipt Scanner</h1>

  <div class="card">
    <h2>Upload a receipt</h2>
    <input type="file" id="image" accept="image/*">
    <button onclick="upload()">Upload &amp; extract</button>
    <pre id="result">Extracted data will appear here.</pre>
  </div>

  <div class="card">
    <h2>Ask about your food</h2>
    <div id="chat">
      <input type="text" id="question" placeholder="e.g. What food did I buy yesterday?">
      <button onclick="ask()">Ask</button>
    </div>
    <div id="answers"></div>
  </div>

  <script>
    async function upload() {
      const file = document.getElementById('image').files[0]

      if (!file) { 
        alert('Choose an image first')
        return }

      const form = new FormData()
      form.append('image', file)

      const res = await fetch('/upload', { method: 'POST', body: form })
      const data = await res.json()

      document.getElementById('result').textContent = JSON.stringify(data, null, 2)
    }

    async function ask() {
      const question = document.getElementById('question').value
      
      if (!question) return

      const answers = document.getElementById('answers')
      answers.insertAdjacentHTML('beforeend', '<div class="msg q">' + question + '</div>')
      document.getElementById('question').value = ''
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      })
      const data = await res.json()
      answers.insertAdjacentHTML('beforeend', '<div class="msg">' + data.answer + '</div>')
    }
  </script>
</body>
</html>
